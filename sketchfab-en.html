<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Viewer - Nomel ESMEL</title>
  <meta name="description" content="Sketchfab viewer for Nomel ESMEL's 3D work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/style.css?v=2026-06-15">
</head>
<body id="top">
  <div class="background-scene" aria-hidden="true">
    <div class="background-glow"></div>
    <div class="background-grid"></div>
    <div class="background-noise"></div>
  </div>
  <div class="page-shell">
    <header id="site-header" class="nova-header compact">
      <div class="glow-rail" aria-hidden="true"></div>
      <div class="header-inner">
        <div class="brand">
          <span class="brand-orb" aria-hidden="true"></span>
          <div class="brand-meta">
            <a class="logo" href="/en/" aria-label="Back to the homepage">Nomel ESMEL</a>
          </div>
        </div>
        <div class="nav-shell">
          <div class="nav-track">
            <nav id="site-navigation" aria-label="Main navigation">
              <a href="/en/#demoreel">Demo Reel</a>
              <a href="/en/#projects">Projects</a>
              <a href="/en/#residential">Residential</a>
              <a href="/en/#about">About</a>
              <a class="nav-contact" href="/en/#contact">Contact</a>
            </nav>
          </div>
        </div>
        <div class="header-actions">
          <a
            class="language-toggle"
            href="/sketchfab.html"
            hreflang="fr"
            lang="fr"
            aria-label="Switch to the French version of the viewer"
          >FR</a>
        </div>
      </div>
    </header>

    <main class="sketchfab-viewer" aria-labelledby="viewer-title">
      <div class="section-heading">
        <p class="eyebrow">Sketchfab</p>
        <div class="section-heading-text">
          <h1 id="viewer-title">3D viewer</h1>
          <p class="categories-intro">Browse an interactive Sketchfab model. Orbit, zoom and inspect materials to see the details up close.</p>
        </div>
      </div>
      <div class="viewer-frame">
        <iframe
          title="Sketchfab viewer"
          src="https://sketchfab.com/models/7w7pAfrh1ZSmkZX8qHK7kNswy/embed?autostart=1&ui_theme=dark&ui_infos=0&ui_hint=0&dnt=1"
          allow="autoplay; fullscreen; vr"
          allowfullscreen
          loading="lazy"
        ></iframe>
      </div>
      <div class="viewer-links">
        <a class="ghost-btn" href="https://sketchfab.com/3d-models/damaged-helmet-7w7pAfrh1ZSmkZX8qHK7kNswy" target="_blank" rel="noopener">Open on Sketchfab</a>
        <a class="ghost-btn" href="/en/#projects">Back to projects</a>
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 Nomel ESMEL · Legal notice · Credits</p>
    </footer>
  </div>
</body>
</html>
